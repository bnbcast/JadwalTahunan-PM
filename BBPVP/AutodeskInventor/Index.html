<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Learning Autodesk Inventor — Part Showcase</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --panel: #fff;
        --line: #d0d7de;
        --fg: #1f2328;
        --mut: #59636e;
        --acc: #1a7f37;
        --blue: #0969da;
        --amb: #9a6700;
        --red: #cf222e;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 60px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          "Liberation Mono",
          monospace;
      }
      nav {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 10px 20px;
        overflow-x: auto;
        white-space: nowrap;
      }
      nav b {
        color: var(--acc);
      }
      nav a {
        color: var(--mut);
        text-decoration: none;
      }
      nav a:hover {
        color: var(--fg);
      }
      .lang {
        margin-left: auto;
        display: flex;
      }
      .lang button {
        border-radius: 0;
      }
      .lang button:first-child {
        border-radius: 6px 0 0 6px;
      }
      .lang button:last-child {
        border-radius: 0 6px 6px 0;
        border-left: 0;
      }
      button,
      select {
        font: inherit;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .on {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
      }
      main {
        max-width: 1060px;
        margin: 0 auto;
        padding: 0 20px 60px;
      }
      section {
        padding: 48px 0 8px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      h2::before {
        content: "## ";
        color: var(--acc);
      }
      .sub {
        color: var(--mut);
        margin: 0 0 16px;
      }
      .c {
        color: var(--mut);
      }
      .g {
        color: var(--acc);
      }
      .b {
        color: var(--blue);
      }
      .r {
        color: var(--red);
      }
      .hero {
        padding-top: 60px;
      }
      .hero h1 {
        font-size: clamp(26px, 5vw, 42px);
        line-height: 1.15;
        margin: 12px 0;
      }
      .kv {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }
      .kv span {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 6px;
        padding: 2px 10px;
        font-size: 12px;
      }
      .kv i {
        font-style: normal;
        color: var(--mut);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      .card .n {
        font-size: 22px;
        color: var(--acc);
      }
      .lbl {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-radius: 4px;
        padding: 0 6px;
        margin-bottom: 6px;
        background: color-mix(in srgb, var(--blue) 14%, transparent);
        color: var(--blue);
      }
      .lbl.o {
        background: color-mix(in srgb, var(--acc) 14%, transparent);
        color: var(--acc);
      }
      .lbl.w {
        background: color-mix(in srgb, var(--amb) 18%, transparent);
        color: var(--amb);
      }
      .win {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .bar {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--mut);
        font-size: 12px;
      }
      .sc {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
        background: var(--panel);
      }
      th,
      td {
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      tr.f {
        cursor: pointer;
      }
      tr.f.hl td {
        background: color-mix(in srgb, var(--red) 10%, transparent);
      }
      #sk {
        width: 100%;
        height: auto;
        display: block;
      }
      #sk text {
        font:
          11px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        fill: var(--fg);
      }
      .v.hl rect.vd {
        stroke-width: 3;
        fill-opacity: 0.9;
      }
      .ctl {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .ctl label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #gl {
        height: 420px;
        background: linear-gradient(#eef2f6, #dde4eb);
        position: relative;
      }
      #gl canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hint {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font-size: 11px;
        color: var(--mut);
      }
      .note {
        border-left: 3px solid var(--amb);
        padding: 8px 12px;
        margin-top: 14px;
        background: var(--panel);
        color: var(--mut);
      }
      ul.ins {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      details {
        margin-top: 12px;
      }
      summary {
        cursor: pointer;
        color: var(--blue);
      }
      .learn {
        border: 1px solid var(--acc);
        background: color-mix(in srgb, var(--acc) 8%, transparent);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 14px 0;
        max-width: 680px;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 24px 20px;
        text-align: center;
        color: var(--mut);
      }
    </style>
  </head>
  <body>
    <nav>
      <b>~/inventor-part</b><a href="#learn" data-t="nL"></a
      ><a href="#part" data-t="n1"></a><a href="#sketch" data-t="n2"></a
      ><a href="#view" data-t="n3"></a><a href="#feat" data-t="n4"></a
      ><a href="#specs" data-t="n5"></a><a href="#ins" data-t="n6"></a
      ><a href="#data" data-t="n7"></a><a href="#tech" data-t="nT"></a>
      <div class="lang">
        <button id="bEN" class="on">EN</button><button id="bID">ID</button>
      </div>
    </nav>
    <main>
      <section class="hero">
        <div class="c">$ cat part.step</div>
        <h1>
          <span data-t="h1a"></span><br /><span class="g" data-t="h1b"></span>
        </h1>
        <p class="c" style="max-width: 680px" data-t="hsub"></p>
        <div class="kv" id="kv"></div>
        <div class="learn" data-t="banner"></div>
      </section>
      <section id="learn">
        <h2 data-t="nL"></h2>
        <p class="sub" data-t="lr_s"></p>
        <div class="cards" id="lr"></div>
      </section>

      <section id="part">
        <h2 data-t="n1"></h2>
        <p class="sub" data-t="part_s"></p>
        <div class="cards" id="flow"></div>
      </section>

      <section id="sketch">
        <h2 data-t="n2"></h2>
        <p class="sub" id="sks"></p>
        <div class="win">
          <div class="bar" id="skb"></div>
          <div style="padding: 8px">
            <svg id="sk" viewBox="0 0 740 480" role="img"></svg>
          </div>
          <div class="ctl">
            <label
              ><input type="checkbox" id="vt" />
              <span data-t="vt"></span></label
            ><span class="c" id="skh"></span>
          </div>
        </div>
      </section>

      <section id="view">
        <h2 data-t="n3"></h2>
        <p class="sub" data-t="v_s"></p>
        <div class="ctl" id="ps" style="border: 0; padding: 0 0 10px"></div>
        <div class="win">
          <div id="gl"><div class="hint" data-t="hint"></div></div>
          <div class="ctl" id="pi"></div>
          <div class="ctl">
            <label
              ><span id="exT"></span
              ><input type="range" id="ex" min="0" max="100" value="100"
            /></label>
            <label id="cuL"
              ><span data-t="c_cut"></span
              ><input type="range" id="cu" min="0" max="100" value="0"
            /></label>
            <label id="xgL"
              ><input type="checkbox" id="xg" />
              <span data-t="c_xg"></span></label
            ><label
              ><input type="checkbox" id="wf" /> <span data-t="c_wf"></span
            ></label>
            <button id="pl" data-t="c_pl"></button
            ><button id="rs" data-t="c_rs"></button><b id="dp" class="g"></b>
          </div>
        </div>
      </section>

      <section id="feat">
        <h2 data-t="n4"></h2>
        <p class="sub" data-t="f_s"></p>
        <div class="sc win"><table id="ft"></table></div>
      </section>

      <section id="specs">
        <h2 data-t="n5"></h2>
        <p class="sub" data-t="sp_s"></p>
        <div class="cards" id="sp"></div>
        <p style="margin-top: 14px">
          <span data-t="mat"></span>
          <select id="ms"></select>
          <b class="g" id="mass"></b>
        </p>
      </section>

      <section id="ins">
        <h2 data-t="n6"></h2>
        <p class="sub" data-t="i_s"></p>
        <ul class="ins" id="il"></ul>
      </section>

      <section id="data">
        <h2 data-t="n7"></h2>
        <p class="sub" data-t="d_s"></p>
        <div class="win">
          <div class="bar">Gambar1.step</div>
          <pre
            style="
              margin: 0;
              padding: 12px;
              white-space: pre-wrap;
              font-size: 12px;
            "
            id="hd"
          ></pre>
        </div>
        <details>
          <summary data-t="d_t"></summary>
          <div
            class="sc win"
            style="margin-top: 8px; max-height: 300px; overflow: auto"
          >
            <table id="vtb"></table>
          </div>
        </details>
      </section>
      <section id="tech">
        <h2 data-t="nT"></h2>
        <p class="sub" data-t="tk_s"></p>
        <div class="cards" id="tc"></div>
      </section>
    </main>
    <footer>
      <span data-t="foot"></span> · <span class="g">status: online</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      const P = {
        v: [

          [63.91, 51.09],

          [46.09, 36.1014],
          [46.09, 51.09],
          [0.0, 51.09],
          [0.0, 40.0],
          [22.0, 40.0],
          [22.0, 30.0],
          [0.0, 30.0],
          [0.0, 22.0],
          [22.0, 22.0],
          [22.0, 12.0],
          [0.0, 12.0],
          [0.0, 0.0],
          [22.0, 0.0],
          [22.0, -8.91],
          [110.0, -8.91],
          [110.0, 0.0],
          [70.0, 0.0],
          [70.0, 12.0],
        ],
        t: 10,
        ymin: -8.91,
        ymax: 51.09,
        xmax: 110.0,
        m: {
          A: 5216.883148000001,
          cx: 57.14397748285544,
          cy: 21.871870929868795,
          per: 537.9772,
        },
        voids: [
          { id: "A", x0: 46.09, y0: 36.1014, x1: 63.91, y1: 51.09 },
          { id: "B", x0: 0, y0: 30, x1: 22, y1: 40 },
          { id: "C", x0: 0, y0: 12, x1: 22, y1: 22 },
          { id: "D", x0: 0, y0: -8.91, x1: 22, y1: 0 },
          { id: "E", x0: 70, y0: 0, x1: 110, y1: 12 },
        ],
      };
      const f2 = (x) => (+x).toFixed(2),
        $ = (id) => document.getElementById(id);
      const W = P.xmax,
        H = P.ymax - P.ymin,
        T = P.t,
        A = P.m.A,
        VOL = A * T,
        BOX = W * H;
      const vs = P.voids.map((o) => ({
          ...o,
          w: o.x1 - o.x0,
          h: o.y1 - o.y0,
          a: (o.x1 - o.x0) * (o.y1 - o.y0),

          i1: "All 22 outline segments are axis-aligned and every corner is 90°. The sketch uses only horizontal and vertical lines.",
          i2: () =>
            `The top notch is centred: it spans x ${f2(vs[0].x0)}–${f2(vs[0].x1)}, so its centre is at x ${f2((vs[0].x0 + vs[0].x1) / 2)}, exactly half of the ${W} mm width.`,
          i3: () =>
            `The cut-outs remove ${f2(RM)} mm² (${((RM / BOX) * 100).toFixed(0)}%) of the ${BOX} mm² rectangle, leaving ${f2(A)} mm².`,

          cur === 1
            ? `${t("rev")}: ${Math.round(ex * 360)}°`
            : `${t("dep")}: ${(p.th * ex).toFixed(1)} mm` +
              (k > 1 ? ` (${t("vis")})` : "");
      }
      function extra() {
        $("lr").innerHTML = t("ls")
          .map(
            (a) =>
              `<div class="card"><span class="lbl ${a[0] === "S" ? "o" : a[0] === "P" ? "w" : ""}">${t("lt")[a[0]]}</span><div><b>${a[1]}</b></div><div class="c">${a[2]}</div></div>`,
          )
          .join("");
        $("tc").innerHTML = t("tk")
          .map(
            (a) =>
              `<div class="card"><span class="lbl">${a[0]}</span><div><b>${a[1]}</b></div><div class="c">${a[2]}</div></div>`,
          )
          .join("");
        $("ps").innerHTML = PARTS.map(
          (p, i) =>
            `<button class="${i === cur ? "on" : ""}" data-i="${i}">${t("pn")[i]}</button>`,
        ).join("");
        const p = PARTS[cur];
        $("pi").innerHTML =
          `<span class="lbl ${p.sample ? "w" : "o"}">${t(p.sample ? "smp" : "own")}</span><span class="c" style="flex:1;min-width:200px">${t("pd")[cur]}</span><span>${p.bb} · ${f2(p.vol / 1000)} cm³</span>`;
        $("exT").textContent = t(cur === 1 ? "c_rev" : "c_ext");
        $("cuL").style.display = cur === 0 ? "" : "none";
        $("xgL").style.display = cur === 1 ? "none" : "";
      }
      $("ps").onclick = (e) => {
        const b = e.target.closest("[data-i]");
        if (b) {
          cur = +b.dataset.i;
          $("ex").value = 100;
          $("cu").value = 0;
          build();
          extra();
          sketch();
          home();
        }
      };
      const ct = new THREE.OrbitControls(cam, rn.domElement);
      ct.enableDamping = true;
      ct.autoRotate = true;
      ct.autoRotateSpeed = 1.2;
      ct.addEventListener("start", () => (ct.autoRotate = false));
      function home() {
        cam.position.set(70, -60, 95);
        ct.target.set(0, 0, 0);
        ct.update();
      }
      home();
      function size() {
        const w = gl.clientWidth,
          h = gl.clientHeight;
        rn.setSize(w, h, false);
        rn.setPixelRatio(Math.min(devicePixelRatio, 2));
        cam.aspect = w / h;
        cam.updateProjectionMatrix();
      }
      addEventListener("resize", size);
      size();
      $("ex").oninput = () => (cur === 1 ? build() : apply());
      ["cu", "xg", "wf"].forEach((i) => ($(i).oninput = apply));
      $("rs").onclick = () => {
        home();
        ct.autoRotate = false;
      };
      let an = 0;
      $("pl").onclick = () => {
        an = performance.now();
        ct.autoRotate = false;
      };
      (function loop() {
        requestAnimationFrame(loop);
        if (an) {
          const e = (performance.now() - an) / 1000;
          let ex = 1,
            cu = 0;
          if (e < 1.6) ex = e / 1.6;
          else if (e > 2.2 && cur === 0) cu = Math.min(1, (e - 2.2) / 1.6);
          if (e > (cur === 0 ? 3.8 : 1.8)) an = 0;
          $("ex").value = ex * 100;
          $("cu").value = cu * 100;
          cur === 1 ? build() : apply();
        }
        ct.update();
        rn.render(sc, cam);
      })();
      build();
      $("bEN").onclick = () => {
        lg = "en";
        R();
      };
      $("bID").onclick = () => {
        lg = "id";
        R();
      };
      R();
    </script>
  </body>
</html>
